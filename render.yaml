services:
- type: web
  name: Finanzas
  env: java
  plan: free
  buildCommand: ./mvnw clean package -DskipTests
  startCommand: java -jar target/finanzas_app-0.0.1-SNAPSHOT.jar
  envVars:
    - key: DB_URL
      value: jdbc:mysql://<HOST>:3306/controlfinanzas
    - key: DB_USER
      value: root
    - key: DB_PASSWORD
      value: jdproot123456
