services:
  - type: web
    name: constru-app
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/constru_app-0.0.1-SNAPSHOT.jar
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
