s

spring.application.name=Finanzas-app

# Puerto: usa el que Render da (PORT), y si no existe, arranca en 7018 localmente
server.port=${PORT:7018}

# ==============================
# ? Config BD Local (MySQL)
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/controlfinanzas
spring.datasource.username=root
spring.datasource.password=jdproot123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# ? Config BD Render (PostgreSQL u otra)
# ==============================
# Si Render define DATABASE_URL, Spring usará esa en lugar de la de arriba.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/controlfinanzas}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:jdproot123456}
# Render puede ser PostgreSQL ? usa el driver correcto si DATABASE_URL lo indica
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto dinámico: Render puede sobrescribirlo con env var
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.MySQL5Dialect}






